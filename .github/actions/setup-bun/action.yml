name: "Setup Bun"
description: "Set up Bun and install frozen workspace dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to bun install"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          bun install --frozen-lockfile --linker hoisted ${{ inputs.install-flags }}
        else
          bun install --frozen-lockfile ${{ inputs.install-flags }}
        fi
      shell: bash
