name: Codius CI diagnostics

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/codius-ci-diagnostics.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  bun-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - id: diagnose
        shell: bash
        run: |
          set +e
          bun install --frozen-lockfile > /tmp/frozen.log 2>&1
          frozen_status=$?
          echo "status=$frozen_status" >> "$GITHUB_OUTPUT"

          if [[ "$frozen_status" != "0" ]]; then
            bun install > /tmp/update.log 2>&1
            update_status=$?
          else
            update_status=0
            : > /tmp/update.log
          fi

          {
            echo "=== frozen install ==="
            cat /tmp/frozen.log
            echo "=== non-frozen install ==="
            cat /tmp/update.log
            echo "=== resulting lockfile diff ==="
            git diff -- bun.lock package.json packages/opencode/package.json
            echo "=== status ==="
            echo "frozen=$frozen_status update=$update_status"
          } > /tmp/summary.log
          exit 0
      - name: Publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.diagnose.outputs.status }}
        shell: bash
        run: |
          marker='<!-- codius-cli-install-diagnostic -->'
          { echo "$marker"; echo '## Codius CLI install diagnostic'; echo; echo "Frozen status: \`$STATUS\`"; echo; echo '```text'; tail -c 30000 /tmp/summary.log; echo; echo '```'; } > /tmp/comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [[ -n "$existing" ]]; then
            jq -n --rawfile body /tmp/comment.md '{body:$body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -
          else
            gh pr comment 1 --body-file /tmp/comment.md
          fi
      - if: steps.diagnose.outputs.status != '0'
        run: exit 1
