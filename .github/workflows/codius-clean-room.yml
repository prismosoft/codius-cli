name: Codius CLI clean-room release

"on":
  push:
    branches: [feat/codius-productization]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codius-cli-finalize
  cancel-in-progress: true

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Rebuild the branch from the upstream base and curated Codius files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/codius-curated
          paths=(
            README.md
            assets/codius-logo.svg
            install
            packages/core/src/flag/flag.ts
            packages/core/src/global.ts
            packages/opencode/src/codius/bootstrap.ts
            packages/opencode/src/plugin/codius.ts
            packages/opencode/test/codius/bootstrap.test.ts
            packages/opencode/bin/codius
            packages/opencode/src/plugin/index.ts
            packages/opencode/src/index.ts
            packages/opencode/src/cli/ui.ts
            packages/tui/src/cli/logo.ts
            packages/tui/src/cli/ui.ts
          )
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              mkdir -p "/tmp/codius-curated/$(dirname "$path")"
              cp -a "$path" "/tmp/codius-curated/$path"
            fi
          done
          test -f /tmp/codius-curated/packages/opencode/src/codius/bootstrap.ts
          test -f /tmp/codius-curated/packages/opencode/src/plugin/codius.ts
          test -f /tmp/codius-curated/packages/opencode/bin/codius
          git fetch origin dev
          git reset --hard origin/dev
          cp -a /tmp/codius-curated/. .

      - name: Apply the final public product and distribution changes
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()

          def read(path: str) -> str:
              return (root / path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding="utf-8")

          def update_json(path: str, fn) -> None:
              data = json.loads(read(path))
              fn(data)
              write(path, json.dumps(data, indent=2, ensure_ascii=False) + "\n")

          def root_package(data: dict) -> None:
              data["name"] = "codius-cli"
              data["description"] = "Codius CLI — an open-source coding agent with Codius models by default"
              data["homepage"] = "https://codius.ai"
              data["repository"] = {"type": "git", "url": "https://github.com/prismosoft/codius-cli.git"}
              data["bugs"] = {"url": "https://github.com/prismosoft/codius-cli/issues"}
          update_json("package.json", root_package)

          def cli_package(data: dict) -> None:
              data["name"] = "codius"
              data["description"] = "The Codius coding agent for the terminal"
              data["bin"] = {"codius": "./bin/codius"}
              data["homepage"] = "https://codius.ai"
              data["repository"] = {"type": "git", "url": "https://github.com/prismosoft/codius-cli.git"}
          update_json("packages/opencode/package.json", cli_package)

          index_path = "packages/opencode/src/index.ts"
          index = read(index_path)
          if 'import { UpgradeCommand } from "./cli/cmd/upgrade"' not in index:
              index = index.replace(
                  'import { AgentCommand } from "./cli/cmd/agent"',
                  'import { AgentCommand } from "./cli/cmd/agent"\nimport { UpgradeCommand } from "./cli/cmd/upgrade"\nimport { UninstallCommand } from "./cli/cmd/uninstall"',
              )
          if ".command(UpgradeCommand)" not in index:
              index = index.replace(
                  ".command(AgentCommand)",
                  ".command(AgentCommand)\n  .command(UpgradeCommand)\n  .command(UninstallCommand)",
              )
          index = index.replace('text.startsWith("opencode ")', 'text.startsWith("codius ")')
          index = index.replace('.scriptName("opencode")', '.scriptName("codius")')
          if 'process.env.CODIUS = "1"' not in index:
              index = index.replace('process.env.OPENCODE = "1"', 'process.env.CODIUS = "1"\n    process.env.OPENCODE = "1"')
          if "process.env.CODIUS_PID" not in index:
              index = index.replace(
                  "process.env.OPENCODE_PID = String(process.pid)",
                  "process.env.CODIUS_PID = String(process.pid)\n    process.env.OPENCODE_PID = String(process.pid)",
              )
          write(index_path, index)

          acp_path = "packages/opencode/src/acp/service.ts"
          acp = read(acp_path)
          acp = acp.replace('export const AuthMethodID = "opencode-login"', 'export const AuthMethodID = "codius-login"')
          acp = acp.replace('description: "Run `opencode auth login` in the terminal"', 'description: "Run `codius providers login --provider codius` in the terminal"')
          acp = acp.replace('name: "Login with opencode"', 'name: "Login with Codius"')
          acp = acp.replace('command: "opencode",\n          args: ["auth", "login"],\n          label: "OpenCode Login"', 'command: "codius",\n          args: ["providers", "login", "--provider", "codius"],\n          label: "Codius Login"')
          acp = acp.replace('name: "OpenCode",\n        version: InstallationVersion', 'name: "Codius",\n        version: InstallationVersion')
          write(acp_path, acp)

          acp_command_path = "packages/opencode/src/cli/cmd/acp.ts"
          acp_command = read(acp_command_path)
          if 'process.env.CODIUS_CLIENT = "acp"' not in acp_command:
              acp_command = acp_command.replace(
                  'process.env.OPENCODE_CLIENT = "acp"',
                  'process.env.CODIUS_CLIENT = "acp"\n    process.env.OPENCODE_CLIENT = "acp"',
              )
          write(acp_command_path, acp_command)

          providers_path = "packages/opencode/src/cli/cmd/providers.ts"
          providers = read(providers_path)
          providers = providers.replace(
              "const priority: Record<string, number> = {\n      opencode: 0,",
              "const priority: Record<string, number> = {\n      codius: 0,\n      opencode: 1,",
          )
          providers = providers.replace(
              'hint: {\n            opencode: "recommended",',
              'hint: {\n            codius: "recommended",\n            opencode: "upstream provider",',
          )
          if 'if (provider === "codius")' not in providers:
              providers = providers.replace(
                  'if (provider === "opencode") {',
                  'if (provider === "codius") {\n      yield* Prompt.log.info("Create an API key at https://codius.ai or use https://dev.codius.dev during development")\n    }\n\n    if (provider === "opencode") {',
              )
          providers = providers.replace("configure it in opencode.json", "configure it in codius.json")
          write(providers_path, providers)

          tui_path = "packages/tui/src/component/dialog-provider.tsx"
          tui = read(tui_path)
          tui = tui.replace(
              "const PROVIDER_PRIORITY: Record<string, number> = {\n  opencode: 0,",
              "const PROVIDER_PRIORITY: Record<string, number> = {\n  codius: 0,\n  opencode: 1,",
          )
          tui = tui.replace(
              'description: {\n          opencode: "(Recommended)",',
              'description: {\n          codius: "(Recommended)",\n          opencode: "(Upstream provider)",',
          )
          tui = tui.replace("Configure the provider in opencode.json", "Configure the provider in codius.json")
          write(tui_path, tui)

          launcher_path = "packages/opencode/bin/codius"
          launcher = read(launcher_path)
          launcher = launcher.replace("const envPath = process.env.OPENCODE_BIN_PATH", "const envPath = process.env.CODIUS_BIN_PATH || process.env.OPENCODE_BIN_PATH")
          launcher = launcher.replace('path.join(scriptDir, ".opencode")', 'path.join(scriptDir, ".codius")')
          launcher = launcher.replace('const base = "opencode-" + platform + "-" + arch', 'const base = "codius-" + platform + "-" + arch')
          launcher = launcher.replace('const binary = platform === "windows" ? "opencode.exe" : "opencode"', 'const binary = platform === "windows" ? "codius.exe" : "codius"')
          launcher = launcher.replace("right version of the opencode CLI", "right version of the Codius CLI")
          write(launcher_path, launcher)

          build_path = "packages/opencode/script/build.ts"
          build = read(build_path)
          build = build.replace("bin/opencode", "bin/codius")
          build = build.replace("opencode/${Script.version}", "codius/${Script.version}")
          build = build.replace("codius-web-ui.gen.ts", "opencode-web-ui.gen.ts")
          write(build_path, build)

          postinstall_path = "packages/opencode/script/postinstall.mjs"
          postinstall = read(postinstall_path)
          postinstall = postinstall.replace("opencode-", "codius-")
          postinstall = postinstall.replace("opencode.exe", "codius.exe")
          postinstall = postinstall.replace('"opencode"', '"codius"')
          postinstall = postinstall.replace("opencode-install-", "codius-install-")
          postinstall = postinstall.replace("right opencode CLI", "right Codius CLI")
          write(postinstall_path, postinstall)

          docker_path = "packages/opencode/Dockerfile"
          docker = read(docker_path)
          docker = docker.replace("opencode-linux", "codius-linux")
          docker = docker.replace("/usr/local/bin/opencode", "/usr/local/bin/codius")
          docker = docker.replace("RUN opencode --version", "RUN codius --version")
          docker = docker.replace('ENTRYPOINT ["opencode"]', 'ENTRYPOINT ["codius"]')
          write(docker_path, docker)

          installation_path = "packages/opencode/src/installation/index.ts"
          installation = read(installation_path)
          for old, new in {
              "`opencode/${InstallationChannel}/${InstallationVersion}/${client}`": "`codius/${InstallationChannel}/${InstallationVersion}/${client}`",
              'path.join(".opencode", "bin")': 'path.join(".codius", "bin")',
              'https://opencode.ai/install': 'https://raw.githubusercontent.com/prismosoft/codius-cli/dev/install',
              'repos/anomalyco/opencode/releases/latest': 'repos/prismosoft/codius-cli/releases/latest',
              '/opencode-ai/${InstallationChannel}': '/codius-ai/${InstallationChannel}',
              '`opencode-ai@${target}`': '`codius-ai@${target}`',
              '["brew", "list", "--formula", "opencode"]': '["brew", "list", "--formula", "codius"]',
              '["scoop", "list", "opencode"]': '["scoop", "list", "codius"]',
              '["choco", "list", "--limit-output", "opencode"]': '["choco", "list", "--limit-output", "codius"]',
              '? "opencode" : "opencode-ai"': '? "codius" : "codius-ai"',
              '["choco", "upgrade", "opencode"': '["choco", "upgrade", "codius"',
              '`opencode@${target}`': '`codius@${target}`',
          }.items():
              installation = installation.replace(old, new)
          write(installation_path, installation)

          for path in ["packages/opencode/src/cli/cmd/upgrade.ts", "packages/opencode/src/cli/cmd/uninstall.ts"]:
              value = read(path)
              value = value.replace("OpenCode", "Codius")
              value = value.replace("opencode-ai", "codius-ai")
              value = value.replace(".opencode", ".codius")
              value = value.replace('"opencode"', '"codius"')
              value = value.replace("'opencode'", "'codius'")
              value = value.replace("# opencode", "# codius")
              value = value.replace("using opencode", "using Codius")
              write(path, value)

          config_path = "packages/opencode/src/config/config.ts"
          config = read(config_path)
          config = config.replace(
              'const candidates = ["opencode.jsonc", "opencode.json", "config.json"]',
              'const candidates = ["codius.jsonc", "codius.json", "config.json", "opencode.jsonc", "opencode.json"]',
          )
          config = config.replace(
              'result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "opencode.jsonc"), env))',
              'result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "opencode.jsonc"), env))\n      result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "codius.json"), env))\n      result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "codius.jsonc"), env))',
          )
          write(config_path, config)

          required = {
              "README.md": ["Codius CLI", "codius acp", "devapi.codius.dev/v1", "api.codius.ai/v1"],
              "packages/opencode/src/index.ts": ['.scriptName("codius")', ".command(AcpCommand)"],
              "packages/opencode/src/acp/service.ts": ['name: "Codius"', 'command: "codius"'],
              "packages/opencode/src/codius/bootstrap.ts": ["https://devapi.codius.dev/v1", "https://api.codius.ai/v1"],
              "packages/opencode/src/plugin/codius.ts": ['provider: "codius"'],
              "packages/opencode/package.json": ['"codius"', '"./bin/codius"'],
          }
          for path, needles in required.items():
              value = read(path)
              for needle in needles:
                  if needle not in value:
                      raise SystemExit(f"Missing {needle!r} in {path}")
          PY
          chmod +x install packages/opencode/bin/codius
          git diff --check

      - name: Install, test, typecheck, and build
        shell: bash
        run: |
          set -euo pipefail
          bun install
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          binary=$(find packages/opencode/dist -type f \( -name codius -o -name codius.exe \) | head -n 1)
          test -n "$binary"
          "$binary" --version
          "$binary" --help | grep -qi codius

      - name: Publish the clean tested branch and merge PR 1
        shell: bash
        run: |
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: productize OpenCode as Codius CLI"
          git push --force-with-lease origin HEAD:feat/codius-productization
          cat > /tmp/body.md <<'EOF'
          ## Codius CLI

          Clean productization of the OpenCode fork as the Codius coding agent.

          - `codius` command and native executable
          - Codius provider selected by default on a fresh installation
          - development `https://devapi.codius.dev/v1` and production `https://api.codius.ai/v1`
          - all upstream providers retained
          - `codius acp` with Codius identity, auth instructions, models, modes, tools, and session support
          - Codius README, logo, installer, package metadata, local paths, Docker, upgrade, and uninstall surfaces
          - upstream-derived internal package namespaces retained for maintainable synchronization

          Validation: provider tests, package typecheck, native build, version/help smoke tests.
          EOF
          gh pr edit 1 --title "feat: productize OpenCode as Codius CLI" --body-file /tmp/body.md
          gh pr ready 1 || true
          gh pr merge 1 --squash --delete-branch || gh pr merge 1 --squash --delete-branch --admin
