name: Codius CLI Compatibility Repair

on:
  push:
    branches:
      - feat/codius-productization
    paths:
      - .github/workflows/codius-compatibility-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply compatibility-safe Codius CLI repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package = Path('packages/opencode/package.json')
          data = json.loads(package.read_text())
          # Keep the inherited internal package identity so native optional-package
          # discovery remains compatible; expose Codius as the public executable.
          data['name'] = 'opencode'
          bins = data.get('bin') if isinstance(data.get('bin'), dict) else {}
          bins['codius'] = './bin/codius'
          if Path('packages/opencode/bin/opencode').exists():
              bins.setdefault('opencode', './bin/opencode')
          data['bin'] = bins
          package.write_text(json.dumps(data, indent=2) + '\n')

          bootstrap = Path('packages/opencode/src/codius/bootstrap.ts')
          text = bootstrap.read_text()
          needle = 'function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n'
          guard = (
              'function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n'
              '  if (\n'
              '    (env.NODE_ENV === "test" || env.BUN_ENV === "test") &&\n'
              '    env.CODIUS_TEST_PROVIDER_BOOTSTRAP !== "1"\n'
              '  )\n'
              '    return false\n'
          )
          if needle in text and 'CODIUS_TEST_PROVIDER_BOOTSTRAP' not in text:
              text = text.replace(needle, guard, 1)
          bootstrap.write_text(text)

          service = Path('packages/opencode/src/acp/service.ts')
          text = service.read_text()
          replacements = {
              'export const AuthMethodID = "opencode-login"': 'export const AuthMethodID = "codius-login"',
              'description: "Run `opencode auth login` in the terminal"': 'description: "Run `codius auth login` in the terminal"',
              'name: "Login with opencode"': 'name: "Login with Codius"',
              'command: "opencode"': 'command: "codius"',
              'label: "OpenCode Login"': 'label: "Codius Login"',
              'name: "OpenCode"': 'name: "Codius"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          service.write_text(text)
          PY

      - name: Install, format, and run focused checks
        run: |
          bun install --frozen-lockfile
          bunx prettier --write packages/opencode/package.json packages/opencode/src/codius/bootstrap.ts packages/opencode/src/acp/service.ts
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode typecheck

      - name: Commit compatibility repair
        shell: bash
        run: |
          rm -f .github/workflows/codius-compatibility-repair.yml
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "fix: preserve native package compatibility in Codius CLI"
          git push origin HEAD:feat/codius-productization
