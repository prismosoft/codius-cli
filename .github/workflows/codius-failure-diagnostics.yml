name: Codius CLI failure diagnostics

on:
  push:
    branches:
      - feat/codius-productization
    paths:
      - .github/workflows/codius-failure-diagnostics.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - id: commands
        shell: bash
        run: |
          set +e
          bun turbo typecheck > /tmp/typecheck.log 2>&1
          typecheck_status=$?
          GITHUB_ACTIONS=false bun turbo test > /tmp/test.log 2>&1
          test_status=$?
          echo "typecheck_status=$typecheck_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          TYPECHECK_STATUS: ${{ steps.commands.outputs.typecheck_status }}
          TEST_STATUS: ${{ steps.commands.outputs.test_status }}
        shell: bash
        run: |
          marker='<!-- codius-cli-failure-diagnostics -->'
          {
            echo "$marker"
            echo '## Codius CLI remaining CI failures'
            echo
            echo "Typecheck status: \`$TYPECHECK_STATUS\`"
            echo "Unit-test status: \`$TEST_STATUS\`"
            echo
            echo '### Typecheck tail'
            echo '```text'
            tail -n 250 /tmp/typecheck.log | tail -c 50000
            echo
            echo '```'
            echo
            echo '### Unit-test tail'
            echo '```text'
            tail -n 350 /tmp/test.log | tail -c 50000
            echo
            echo '```'
          } > /tmp/comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/1/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [[ -n "$existing" ]]; then
            jq -n --rawfile body /tmp/comment.md '{body:$body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input -
          else
            gh pr comment 1 --body-file /tmp/comment.md
          fi
      - if: steps.commands.outputs.typecheck_status != '0' || steps.commands.outputs.test_status != '0'
        run: exit 1
