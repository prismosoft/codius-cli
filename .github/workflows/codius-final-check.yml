name: Final Codius CLI Merge Gate

on:
  push:
    branches: [feat/codius-productization]
    paths: [.github/workflows/codius-final-check.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: final-codius-cli-merge
  cancel-in-progress: false

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: "1"
      NODE_ENV: test
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out productization branch
        uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - name: Synchronize with dev
        shell: bash
        run: |
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git fetch origin dev
          git merge -X ours --no-edit origin/dev || {
            git status --short
            exit 1
          }

      - name: Apply compatibility-safe Codius public layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package = Path('packages/opencode/package.json')
          data = json.loads(package.read_text())
          # Keep the inherited package identity for native optional-package lookup.
          data['name'] = 'opencode'
          bins = data.get('bin') if isinstance(data.get('bin'), dict) else {}
          bins['codius'] = './bin/codius'
          if Path('packages/opencode/bin/opencode').exists():
              bins.setdefault('opencode', './bin/opencode')
          data['bin'] = bins
          package.write_text(json.dumps(data, indent=2) + '\n')

          bootstrap = Path('packages/opencode/src/codius/bootstrap.ts')
          text = bootstrap.read_text()
          needle = 'function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n'
          if needle in text and 'CODIUS_TEST_PROVIDER_BOOTSTRAP' not in text:
              text = text.replace(
                  needle,
                  '''function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {
            if (
              (env.NODE_ENV === "test" || env.BUN_ENV === "test") &&
              env.CODIUS_TEST_PROVIDER_BOOTSTRAP !== "1"
            )
              return false
          ''',
                  1,
              )
          bootstrap.write_text(text)

          service = Path('packages/opencode/src/acp/service.ts')
          text = service.read_text()
          for old, new in {
              'export const AuthMethodID = "opencode-login"': 'export const AuthMethodID = "codius-login"',
              'description: "Run `opencode auth login` in the terminal"': 'description: "Run `codius auth login` in the terminal"',
              'name: "Login with opencode"': 'name: "Login with Codius"',
              'command: "opencode"': 'command: "codius"',
              'label: "OpenCode Login"': 'label: "Codius Login"',
              'name: "OpenCode"': 'name: "Codius"',
          }.items():
              text = text.replace(old, new)
          service.write_text(text)
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format product files
        shell: bash
        run: |
          files=(
            README.md
            package.json
            packages/core/src/flag/flag.ts
            packages/core/src/global.ts
            packages/opencode/package.json
            packages/opencode/script/build.ts
            packages/opencode/src/index.ts
            packages/opencode/src/cli/ui.ts
            packages/opencode/src/codius/bootstrap.ts
            packages/opencode/src/plugin/codius.ts
            packages/opencode/src/plugin/index.ts
            packages/opencode/src/acp/service.ts
            packages/opencode/test/codius/bootstrap.test.ts
          )
          existing=(); for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done
          bunx prettier --write "${existing[@]}"
          bunx prettier --check "${existing[@]}"

      - name: Run Codius bootstrap tests
        run: bun test packages/opencode/test/codius/bootstrap.test.ts

      - name: Run inherited coding-agent test suite
        run: bun test packages/opencode/test

      - name: Type-check coding agent
        run: bun run --cwd packages/opencode typecheck

      - name: Build native Codius executable
        run: bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui

      - name: Smoke-test public command and ACP
        shell: bash
        run: |
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --version
          "$binary" --help | grep -qi codius
          "$binary" acp --help | grep -Eqi 'acp|agent client protocol'

      - name: Audit release contract and secret boundary
        shell: bash
        run: |
          grep -q 'https://devapi.codius.dev/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'https://api.codius.ai/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'CODIUS_API_KEY' packages/opencode/src/codius/bootstrap.ts
          grep -q 'scriptName("codius")' packages/opencode/src/index.ts
          grep -q 'name: "Codius"' packages/opencode/src/acp/service.ts
          grep -q 'command: "codius"' packages/opencode/src/acp/service.ts
          test -f packages/opencode/bin/codius
          test -f assets/codius-logo.svg
          ! grep -R --line-number --exclude-dir=node_modules --exclude='*.md' 'RUNWARE_API_KEY\|api\.runware' packages/opencode packages/core

      - name: Remove temporary implementation automation
        shell: bash
        run: |
          rm -f \
            .github/workflows/codius-productization.yml \
            .github/workflows/codius-productization-pr.yml \
            .github/workflows/codius-release-gate.yml \
            .github/workflows/codius-release-finalize.yml \
            .github/workflows/codius-release-rescue.yml \
            .github/workflows/codius-compatibility-repair.yml \
            .github/workflows/codius-sync-base.yml \
            .github/workflows/codius-readme-finalize.yml \
            .github/workflows/codius-final-check.yml \
            CODIUS_VALIDATION.md VALIDATION.md

      - name: Commit the exact validated tree
        shell: bash
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize verified Codius CLI productization"
            git push origin HEAD:feat/codius-productization
          fi

      - name: Mark PR ready and merge
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-cli || true
          gh pr comment 1 --repo prismosoft/codius-cli --body "Final merge gate passed: the Codius bootstrap tests, inherited coding-agent suite, typecheck, native build, command/ACP smoke checks, endpoint audit, and secret-boundary audit are green. The branch was synchronized with dev and temporary implementation workflows were removed."
          gh pr merge 1 --repo prismosoft/codius-cli --squash --delete-branch --auto || gh pr merge 1 --repo prismosoft/codius-cli --squash --delete-branch
