name: Finalize Codius CLI productization

"on":
  push:
    branches:
      - feat/codius-productization

permissions:
  contents: write

concurrency:
  group: codius-cli-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply final Codius CLI changes
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding="utf-8")

          def replace(path: str, old: str, new: str, *, required: bool = False) -> bool:
              value = read(path)
              if old not in value:
                  if required:
                      raise RuntimeError(f"Expected text not found in {path}: {old[:100]!r}")
                  return False
              write(path, value.replace(old, new))
              return True

          def replace_regex(path: str, pattern: str, replacement: str, *, count: int = 0, required: bool = False) -> int:
              value = read(path)
              next_value, changed = re.subn(pattern, replacement, value, count=count, flags=re.MULTILINE)
              if required and changed == 0:
                  raise RuntimeError(f"Expected regex not found in {path}: {pattern}")
              if changed:
                  write(path, next_value)
              return changed

          def update_json(path: str, mutator) -> None:
              value = json.loads(read(path))
              mutator(value)
              write(path, json.dumps(value, indent=2, ensure_ascii=False) + "\n")

          def root_package(pkg: dict) -> None:
              pkg["name"] = "codius-cli"
              pkg["description"] = "Codius CLI — an open-source coding agent with Codius models by default"
              pkg["repository"] = {
                  "type": "git",
                  "url": "https://github.com/prismosoft/codius-cli.git",
              }
              pkg["homepage"] = "https://codius.ai"
              pkg["bugs"] = {"url": "https://github.com/prismosoft/codius-cli/issues"}

          update_json("package.json", root_package)

          def cli_package(pkg: dict) -> None:
              pkg["name"] = "codius"
              pkg["description"] = "The Codius coding agent for the terminal"
              pkg["bin"] = {"codius": "./bin/codius"}
              pkg["repository"] = {
                  "type": "git",
                  "url": "https://github.com/prismosoft/codius-cli.git",
              }
              pkg["homepage"] = "https://codius.ai"

          update_json("packages/opencode/package.json", cli_package)

          index_path = "packages/opencode/src/index.ts"
          index = read(index_path)
          if 'import { UpgradeCommand } from "./cli/cmd/upgrade"' not in index:
              index = index.replace(
                  'import { AgentCommand } from "./cli/cmd/agent"',
                  'import { AgentCommand } from "./cli/cmd/agent"\nimport { UpgradeCommand } from "./cli/cmd/upgrade"\nimport { UninstallCommand } from "./cli/cmd/uninstall"',
              )
          if ".command(UpgradeCommand)" not in index:
              index = index.replace(
                  ".command(AgentCommand)",
                  ".command(AgentCommand)\n  .command(UpgradeCommand)\n  .command(UninstallCommand)",
              )
          index = index.replace('text.startsWith("opencode ")', 'text.startsWith("codius ")')
          index = index.replace('.scriptName("opencode")', '.scriptName("codius")')
          if 'process.env.CODIUS = "1"' not in index:
              index = index.replace(
                  'process.env.OPENCODE = "1"',
                  'process.env.CODIUS = "1"\n    process.env.OPENCODE = "1"',
              )
          if "process.env.CODIUS_PID" not in index:
              index = index.replace(
                  "process.env.OPENCODE_PID = String(process.pid)",
                  "process.env.CODIUS_PID = String(process.pid)\n    process.env.OPENCODE_PID = String(process.pid)",
              )
          write(index_path, index)

          acp_path = "packages/opencode/src/acp/service.ts"
          acp = read(acp_path)
          acp = acp.replace('export const AuthMethodID = "opencode-login"', 'export const AuthMethodID = "codius-login"')
          acp = acp.replace('description: "Run `opencode auth login` in the terminal"', 'description: "Run `codius providers login --provider codius` in the terminal"')
          acp = acp.replace('name: "Login with opencode"', 'name: "Login with Codius"')
          acp = acp.replace('command: "opencode",\n          args: ["auth", "login"],\n          label: "OpenCode Login"', 'command: "codius",\n          args: ["providers", "login", "--provider", "codius"],\n          label: "Codius Login"')
          acp = acp.replace('name: "OpenCode",\n        version: InstallationVersion', 'name: "Codius",\n        version: InstallationVersion')
          write(acp_path, acp)

          acp_cmd_path = "packages/opencode/src/cli/cmd/acp.ts"
          acp_cmd = read(acp_cmd_path)
          if 'process.env.CODIUS_CLIENT = "acp"' not in acp_cmd:
              acp_cmd = acp_cmd.replace(
                  'process.env.OPENCODE_CLIENT = "acp"',
                  'process.env.CODIUS_CLIENT = "acp"\n    process.env.OPENCODE_CLIENT = "acp"',
              )
          write(acp_cmd_path, acp_cmd)

          providers_path = "packages/opencode/src/cli/cmd/providers.ts"
          providers = read(providers_path)
          if "codius: 0" not in providers:
              providers = providers.replace(
                  "const priority: Record<string, number> = {\n      opencode: 0,",
                  "const priority: Record<string, number> = {\n      codius: 0,\n      opencode: 1,",
              )
              for provider, old, new in [
                  ('openai', 'openai: 1', 'openai: 2'),
                  ('github-copilot', '"github-copilot": 2', '"github-copilot": 3'),
                  ('google', 'google: 3', 'google: 4'),
                  ('anthropic', 'anthropic: 4', 'anthropic: 5'),
                  ('openrouter', 'openrouter: 5', 'openrouter: 6'),
                  ('vercel', 'vercel: 6', 'vercel: 7'),
              ]:
                  providers = providers.replace(old, new)
          providers = providers.replace(
              'hint: {\n            opencode: "recommended",',
              'hint: {\n            codius: "recommended",\n            opencode: "upstream provider",',
          )
          if 'if (provider === "codius")' not in providers:
              marker = 'if (provider === "opencode") {'
              insert = 'if (provider === "codius") {\n      yield* Prompt.log.info("Create a Codius API key at https://codius.ai or use https://dev.codius.dev during development")\n    }\n\n    '
              providers = providers.replace(marker, insert + marker)
          providers = providers.replace("configure it in opencode.json", "configure it in codius.json")
          providers = providers.replace("opencode auth provider", "Codius auth provider")
          write(providers_path, providers)

          tui_provider_path = "packages/tui/src/component/dialog-provider.tsx"
          tui_provider = read(tui_provider_path)
          if "codius: 0" not in tui_provider:
              tui_provider = tui_provider.replace(
                  "const PROVIDER_PRIORITY: Record<string, number> = {\n  opencode: 0,",
                  "const PROVIDER_PRIORITY: Record<string, number> = {\n  codius: 0,\n  opencode: 1,",
              )
              tui_provider = tui_provider.replace('"opencode-go": 1', '"opencode-go": 2')
              tui_provider = tui_provider.replace('openai: 2', 'openai: 3')
              tui_provider = tui_provider.replace('"github-copilot": 3', '"github-copilot": 4')
              tui_provider = tui_provider.replace('anthropic: 4', 'anthropic: 5')
              tui_provider = tui_provider.replace('google: 5', 'google: 6')
          tui_provider = tui_provider.replace(
              'description: {\n          opencode: "(Recommended)",',
              'description: {\n          codius: "(Recommended)",\n          opencode: "(Upstream provider)",',
          )
          tui_provider = tui_provider.replace("Configure the provider in opencode.json", "Configure the provider in codius.json")
          write(tui_provider_path, tui_provider)

          installation_path = "packages/opencode/src/installation/index.ts"
          installation = read(installation_path)
          replacements = {
              "`opencode/${InstallationChannel}/${InstallationVersion}/${client}`": "`codius/${InstallationChannel}/${InstallationVersion}/${client}`",
              'path.join(".opencode", "bin")': 'path.join(".codius", "bin")',
              'https://opencode.ai/install': 'https://raw.githubusercontent.com/prismosoft/codius-cli/dev/install',
              'anomalyco/tap/opencode': 'prismosoft/tap/codius',
              'formula/opencode.json': 'formula/codius.json',
              '/opencode-ai/${InstallationChannel}': '/codius-ai/${InstallationChannel}',
              "Id%20eq%20%27opencode%27": "Id%20eq%20%27codius%27",
              '/bucket/opencode.json': '/bucket/codius.json',
              'repos/anomalyco/opencode/releases/latest': 'repos/prismosoft/codius-cli/releases/latest',
              '`opencode-ai@${target}`': '`codius-ai@${target}`',
              '["brew", "list", "--formula", "opencode"]': '["brew", "list", "--formula", "codius"]',
              '["scoop", "list", "opencode"]': '["scoop", "list", "codius"]',
              '["choco", "list", "--limit-output", "opencode"]': '["choco", "list", "--limit-output", "codius"]',
              '? "opencode" : "opencode-ai"': '? "codius" : "codius-ai"',
              '["choco", "upgrade", "opencode"': '["choco", "upgrade", "codius"',
              '`opencode@${target}`': '`codius@${target}`',
          }
          for old, new in replacements.items():
              installation = installation.replace(old, new)
          write(installation_path, installation)

          for path in [
              "packages/opencode/src/cli/cmd/upgrade.ts",
              "packages/opencode/src/cli/cmd/uninstall.ts",
          ]:
              value = read(path)
              value = value.replace("OpenCode", "Codius")
              value = value.replace("opencode-ai", "codius-ai")
              value = value.replace(".opencode", ".codius")
              value = value.replace('"opencode"', '"codius"')
              value = value.replace("'opencode'", "'codius'")
              value = value.replace(" opencode ", " codius ")
              value = value.replace("# opencode", "# codius")
              value = value.replace("using opencode", "using Codius")
              write(path, value)

          build_path = "packages/opencode/script/build.ts"
          build = read(build_path)
          build = build.replace("bin/opencode", "bin/codius")
          build = build.replace("opencode/${Script.version}", "codius/${Script.version}")
          build = build.replace('"opencode-web-ui.gen.ts"', '"codius-web-ui.gen.ts"')
          build = build.replace("opencode-web-ui.gen.ts", "codius-web-ui.gen.ts")
          write(build_path, build)

          postinstall_path = "packages/opencode/script/postinstall.mjs"
          postinstall = read(postinstall_path)
          postinstall = postinstall.replace("opencode-", "codius-")
          postinstall = postinstall.replace("opencode.exe", "codius.exe")
          postinstall = postinstall.replace('"opencode"', '"codius"')
          postinstall = postinstall.replace("opencode-install-", "codius-install-")
          postinstall = postinstall.replace("right opencode CLI", "right Codius CLI")
          write(postinstall_path, postinstall)

          publish_path = "packages/opencode/script/publish.ts"
          publish = read(publish_path)
          publish = publish.replace("ghcr.io/anomalyco/opencode", "ghcr.io/prismosoft/codius-cli")
          publish = publish.replace("anomalyco/opencode", "prismosoft/codius-cli")
          publish = publish.replace("anomalyco/homebrew-tap", "prismosoft/homebrew-tap")
          publish = publish.replace("opencode-linux", "codius-linux")
          publish = publish.replace("opencode-darwin", "codius-darwin")
          publish = publish.replace("opencode-bin", "codius-bin")
          publish = publish.replace("provides=('opencode')", "provides=('codius')")
          publish = publish.replace("conflicts=('opencode')", "conflicts=('codius')")
          publish = publish.replace('/usr/bin/opencode', '/usr/bin/codius')
          publish = publish.replace('class Opencode < Formula', 'class Codius < Formula')
          publish = publish.replace('bin.install "opencode"', 'bin.install "codius"')
          publish = publish.replace('homebrew-tap/opencode.rb', 'homebrew-tap/codius.rb')
          publish = publish.replace("The AI coding agent built for the terminal.", "The Codius coding agent for the terminal.")
          write(publish_path, publish)

          docker_path = "packages/opencode/Dockerfile"
          docker = read(docker_path)
          docker = docker.replace("opencode-linux", "codius-linux")
          docker = docker.replace("/usr/local/bin/opencode", "/usr/local/bin/codius")
          docker = docker.replace("RUN opencode --version", "RUN codius --version")
          docker = docker.replace('ENTRYPOINT ["opencode"]', 'ENTRYPOINT ["codius"]')
          write(docker_path, docker)

          config_path = "packages/opencode/src/config/config.ts"
          config = read(config_path)
          config = config.replace(
              'const candidates = ["opencode.jsonc", "opencode.json", "config.json"]',
              'const candidates = ["codius.jsonc", "codius.json", "config.json", "opencode.jsonc", "opencode.json"]',
          )
          config = config.replace(
              'result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "opencode.json"), env))\n      result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "opencode.jsonc"), env))',
              'result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "opencode.json"), env))\n      result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "opencode.jsonc"), env))\n      result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "codius.json"), env))\n      result = mergeConfig(result, yield* loadFile(path.join(Global.Path.config, "codius.jsonc"), env))',
          )
          write(config_path, config)

          bin_path = ROOT / "packages/opencode/bin/codius"
          if not bin_path.exists():
              raise RuntimeError("packages/opencode/bin/codius is missing")

          for stale in [
              ".github/workflows/codius-productization.yml",
              ".github/workflows/codius-finalize.yml",
          ]:
              target = ROOT / stale
              if target.exists():
                  target.unlink()

          required_strings = {
              "packages/opencode/src/index.ts": ['.scriptName("codius")', ".command(AcpCommand)"],
              "packages/opencode/src/acp/service.ts": ['name: "Codius"', 'command: "codius"'],
              "packages/opencode/src/codius/bootstrap.ts": ["https://devapi.codius.dev/v1", "https://api.codius.ai/v1"],
              "packages/opencode/src/plugin/codius.ts": ['provider: "codius"'],
              "packages/opencode/package.json": ['"codius"', '"./bin/codius"'],
          }
          for path, needles in required_strings.items():
              value = read(path)
              for needle in needles:
                  if needle not in value:
                      raise RuntimeError(f"Missing {needle!r} in {path}")
          PY

          chmod +x install packages/opencode/bin/codius
          git diff --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Codius bootstrap
        run: bun test packages/opencode/test/codius/bootstrap.test.ts

      - name: Typecheck CLI package
        run: bun run --cwd packages/opencode typecheck

      - name: Build native Codius binary
        run: bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui

      - name: Commit finalized productization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: finalize Codius CLI productization"
          git push origin HEAD:feat/codius-productization
