name: Productize Codius CLI

on:
  push:
    branches:
      - feat/codius-productization
    paths:
      - .github/workflows/codius-productization.yml

permissions:
  contents: write

jobs:
  productize:
    if: ${{ !contains(github.event.head_commit.message, '[skip productize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Materialize productization tool
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib, zlib
          payload = ""
          pathlib.Path('/tmp/apply_codius_cli.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY

      - name: Apply Codius CLI product layer
        run: python /tmp/apply_codius_cli.py . --no-branch --allow-dirty

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run typecheck

      - name: Build native CLI
        run: bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui

      - name: Commit validated productization
        shell: bash
        run: |
          git config user.name "Codius Automation"
          git config user.email "actions@codius.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "No productization changes to commit."
            exit 0
          fi
          git commit -m "feat: productize OpenCode fork as Codius CLI"
          git push origin HEAD:feat/codius-productization
