name: Finalize Codius CLI Release Readiness v2

on:
  push:
    branches: [dev]
    paths: [.github/workflows/codius-readiness-v2.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: codius-cli-readiness-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      CI: "1"
      NODE_ENV: test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }

      - name: Select current product source
        id: source
        shell: bash
        run: |
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git fetch origin dev
          if git ls-remote --exit-code --heads origin feat/codius-productization >/dev/null 2>&1; then
            git fetch origin feat/codius-productization
            git checkout -B feat/codius-productization origin/feat/codius-productization
            git merge -X ours --no-edit origin/dev
            echo "feature=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -B dev origin/dev
            echo "feature=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize package identity, ACP identity, and test isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          package=Path('packages/opencode/package.json')
          if not package.exists(): raise SystemExit('packages/opencode/package.json is missing')
          data=json.loads(package.read_text())
          data['name']='opencode'
          bins=data.get('bin') if isinstance(data.get('bin'),dict) else {}
          bins['codius']='./bin/codius'
          if Path('packages/opencode/bin/opencode').exists(): bins.setdefault('opencode','./bin/opencode')
          data['bin']=bins
          package.write_text(json.dumps(data,indent=2)+'\n')

          bootstrap=Path('packages/opencode/src/codius/bootstrap.ts')
          if not bootstrap.exists(): raise SystemExit('Codius provider bootstrap is missing')
          text=bootstrap.read_text()
          needle='function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n'
          if needle in text and 'CODIUS_TEST_PROVIDER_BOOTSTRAP' not in text:
              text=text.replace(needle,'''function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {
            if ((env.NODE_ENV === "test" || env.BUN_ENV === "test") && env.CODIUS_TEST_PROVIDER_BOOTSTRAP !== "1")
              return false
          ''',1)
          bootstrap.write_text(text)

          service=Path('packages/opencode/src/acp/service.ts')
          text=service.read_text()
          for old,new in {
            'export const AuthMethodID = "opencode-login"':'export const AuthMethodID = "codius-login"',
            'description: "Run `opencode auth login` in the terminal"':'description: "Run `codius auth login` in the terminal"',
            'name: "Login with opencode"':'name: "Login with Codius"',
            'command: "opencode"':'command: "codius"',
            'label: "OpenCode Login"':'label: "Codius Login"',
            'name: "OpenCode"':'name: "Codius"',
          }.items(): text=text.replace(old,new)
          service.write_text(text)
          PY

      - name: Refresh and verify Bun lockfile
        shell: bash
        run: |
          bun install
          bun install --frozen-lockfile

      - name: Format and validate source
        shell: bash
        run: |
          files=(README.md package.json packages/core/src/flag/flag.ts packages/core/src/global.ts packages/opencode/package.json packages/opencode/script/build.ts packages/opencode/src/index.ts packages/opencode/src/cli/ui.ts packages/opencode/src/codius/bootstrap.ts packages/opencode/src/plugin/codius.ts packages/opencode/src/plugin/index.ts packages/opencode/src/acp/service.ts packages/opencode/test/codius/bootstrap.test.ts)
          existing=(); for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done
          bunx prettier --write "${existing[@]}"
          bunx prettier --check "${existing[@]}"
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode test
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --version
          "$binary" --help | grep -qi codius
          "$binary" acp --help | grep -Eqi 'acp|agent client protocol'
          grep -q 'https://devapi.codius.dev/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'https://api.codius.ai/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'CODIUS_API_KEY' packages/opencode/src/codius/bootstrap.ts
          grep -q 'name: "Codius"' packages/opencode/src/acp/service.ts
          grep -q 'command: "codius"' packages/opencode/src/acp/service.ts
          ! grep -R --line-number --exclude-dir=node_modules --exclude='*.md' 'RUNWARE_API_KEY\|api\.runware' packages/opencode packages/core

      - name: Clean temporary automation and commit validated source
        shell: bash
        run: |
          rm -f .github/workflows/codius-productization.yml .github/workflows/codius-productization-pr.yml .github/workflows/codius-release-gate.yml .github/workflows/codius-release-finalize.yml .github/workflows/codius-release-rescue.yml .github/workflows/codius-compatibility-repair.yml .github/workflows/codius-sync-base.yml .github/workflows/codius-readme-finalize.yml .github/workflows/codius-final-check.yml .github/workflows/codius-release-orchestrator.yml CODIUS_VALIDATION.md VALIDATION.md
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize Codius CLI release source"
            if [[ "${{ steps.source.outputs.feature }}" == "true" ]]; then git push origin HEAD:feat/codius-productization; else git push origin HEAD:dev; fi
          fi

      - name: Merge feature branch when present
        if: steps.source.outputs.feature == 'true'
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-cli || true
          gh pr merge 1 --repo prismosoft/codius-cli --squash --delete-branch --admin
          for attempt in $(seq 1 60); do
            [[ "$(gh pr view 1 --repo prismosoft/codius-cli --json state --jq .state)" == "MERGED" ]] && exit 0
            sleep 5
          done
          exit 1

      - name: Re-check exact dev branch
        shell: bash
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          git reset --hard origin/dev
          bun install --frozen-lockfile
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          test -f .github/workflows/codius-ci.yml
          test -f .github/workflows/codius-release.yml
          test -f docs/releasing.md

      - name: Explicitly run permanent Codius CI on validated commit
        id: permanent
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          gh workflow run codius-ci.yml --repo prismosoft/codius-cli --ref dev
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo prismosoft/codius-cli --workflow codius-ci.yml --branch dev --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo prismosoft/codius-cli --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Record evidence and remove v2 orchestrator
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/release-readiness.md <<EOF
          # Codius CLI release readiness

          Validated source commit: \`${{ steps.permanent.outputs.source_sha }}\`

          Permanent CI run: ${{ github.server_url }}/prismosoft/codius-cli/actions/runs/${{ steps.permanent.outputs.run_id }}

          The source passed the Codius provider tests, inherited coding-agent test suite, typecheck, native build, public command and ACP smoke tests, endpoint contract audit, lockfile verification, and client-side secret-boundary audit.

          Permanent CI: \`.github/workflows/codius-ci.yml\`

          Release packaging: \`.github/workflows/codius-release.yml\`
          EOF
          rm -f .github/workflows/codius-readiness-v2.yml
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "chore: record verified Codius CLI release readiness"
          git push origin HEAD:dev
