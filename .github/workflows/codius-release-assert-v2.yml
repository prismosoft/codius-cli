name: Sequential Final Codius CLI Release Assertion

on:
  push:
    branches: [dev]
    paths: [.github/workflows/codius-release-assert-v2.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sequential-final-codius-cli
  cancel-in-progress: false

jobs:
  assert:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      CI: "1"
      NODE_ENV: test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Select source
        id: source
        shell: bash
        run: |
          git config user.name "Codius CI"; git config user.email "actions@codius.ai"
          git fetch origin dev
          state="$(gh pr view 1 --repo prismosoft/codius-cli --json state --jq .state 2>/dev/null || echo UNKNOWN)"
          if [[ "$state" == OPEN ]] && git ls-remote --exit-code --heads origin feat/codius-productization >/dev/null 2>&1; then
            git fetch origin feat/codius-productization
            git checkout -B feat/codius-productization origin/feat/codius-productization
            git merge -X ours --no-edit origin/dev
            echo feature=true >> "$GITHUB_OUTPUT"
          else
            git checkout -B dev origin/dev
            echo feature=false >> "$GITHUB_OUTPUT"
          fi
      - name: Normalize and validate source
        id: validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          pkg=Path('packages/opencode/package.json')
          if not pkg.exists(): raise SystemExit('Codius coding-agent package is missing')
          data=json.loads(pkg.read_text()); data['name']='opencode'
          bins=data.get('bin') if isinstance(data.get('bin'),dict) else {}; bins['codius']='./bin/codius'
          if Path('packages/opencode/bin/opencode').exists(): bins.setdefault('opencode','./bin/opencode')
          data['bin']=bins; pkg.write_text(json.dumps(data,indent=2)+'\n')
          bootstrap=Path('packages/opencode/src/codius/bootstrap.ts')
          if not bootstrap.exists(): raise SystemExit('Codius provider bootstrap is missing')
          text=bootstrap.read_text(); needle='function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n'
          if needle in text and 'CODIUS_TEST_PROVIDER_BOOTSTRAP' not in text:
              text=text.replace(needle,'function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n  if ((env.NODE_ENV === "test" || env.BUN_ENV === "test") && env.CODIUS_TEST_PROVIDER_BOOTSTRAP !== "1") return false\n',1)
          bootstrap.write_text(text)
          service=Path('packages/opencode/src/acp/service.ts'); text=service.read_text()
          for old,new in {'export const AuthMethodID = "opencode-login"':'export const AuthMethodID = "codius-login"','description: "Run `opencode auth login` in the terminal"':'description: "Run `codius auth login` in the terminal"','name: "Login with opencode"':'name: "Login with Codius"','command: "opencode"':'command: "codius"','label: "OpenCode Login"':'label: "Codius Login"','name: "OpenCode"':'name: "Codius"'}.items(): text=text.replace(old,new)
          service.write_text(text)
          PY
          bun install
          bun install --frozen-lockfile
          files=(README.md package.json packages/core/src/flag/flag.ts packages/core/src/global.ts packages/opencode/package.json packages/opencode/script/build.ts packages/opencode/src/index.ts packages/opencode/src/cli/ui.ts packages/opencode/src/codius/bootstrap.ts packages/opencode/src/plugin/codius.ts packages/opencode/src/plugin/index.ts packages/opencode/src/acp/service.ts packages/opencode/test/codius/bootstrap.test.ts)
          existing=(); for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done
          bunx prettier --write "${existing[@]}"; bunx prettier --check "${existing[@]}"
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode test
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n1)"; test -n "$binary"
          "$binary" --version; "$binary" --help | grep -qi codius; "$binary" acp --help | grep -Eqi 'acp|agent client protocol'
          grep -q 'https://api.codius.ai/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'https://devapi.codius.dev/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'CODIUS_API_KEY' packages/opencode/src/codius/bootstrap.ts
          grep -q 'name: "Codius"' packages/opencode/src/acp/service.ts
          ! grep -R --line-number --exclude-dir=node_modules --exclude='*.md' 'RUNWARE_API_KEY\|api\.runware' packages/opencode packages/core
          echo sha=$(git rev-parse HEAD) >> "$GITHUB_OUTPUT"
      - name: Clean and commit source
        shell: bash
        run: |
          find .github/workflows -maxdepth 1 -type f \( -name 'codius-productization*' -o -name 'codius-release-gate.yml' -o -name 'codius-release-finalize.yml' -o -name 'codius-release-rescue.yml' -o -name 'codius-compatibility-repair.yml' -o -name 'codius-final-check.yml' -o -name 'codius-release-orchestrator.yml' -o -name 'codius-readiness-v*.yml' -o -name 'codius-release-assert.yml' \) -delete
          rm -f CODIUS_VALIDATION.md VALIDATION.md
          git add -A
          if ! git diff --cached --quiet; then git commit -m "feat: finalize sequentially verified Codius CLI"; if [[ "${{ steps.source.outputs.feature }}" == true ]]; then git push origin HEAD:feat/codius-productization; else git push origin HEAD:dev; fi; fi
      - name: Merge open PR
        if: steps.source.outputs.feature == 'true'
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-cli || true
          gh pr merge 1 --repo prismosoft/codius-cli --squash --delete-branch --admin
      - name: Validate exact dev, write manifest, and self-remove
        shell: bash
        run: |
          git fetch origin dev; git checkout -B dev origin/dev; git reset --hard origin/dev
          bun install --frozen-lockfile
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n1)"; test -n "$binary"; "$binary" acp --help | grep -Eqi 'acp|agent client protocol'
          test -f .github/workflows/codius-ci.yml; test -f .github/workflows/codius-release.yml; test -f docs/releasing.md
          sha="$(git rev-parse HEAD)"
          mkdir -p docs
          cat > docs/release-ready.json <<EOF
          {"product":"Codius CLI","status":"release-ready","validated_source_sha":"$sha","validation_run":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","command":"codius","acp_command":"codius acp","production_api":"https://api.codius.ai/v1","development_api":"https://devapi.codius.dev/v1"}
          EOF
          rm -f .github/workflows/codius-release-assert-v2.yml
          git config user.name "Codius CI"; git config user.email "actions@codius.ai"
          git add -A; git commit -m "chore: publish final Codius CLI readiness manifest"; git push origin HEAD:dev
