name: Codius CLI Release Gate

on:
  push:
    branches:
      - feat/codius-productization
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codius-cli-release-gate
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-gate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - name: Check out productization branch
        uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply repository formatting to Codius changes
        shell: bash
        run: |
          files=(
            README.md
            package.json
            packages/core/src/flag/flag.ts
            packages/core/src/global.ts
            packages/opencode/package.json
            packages/opencode/script/build.ts
            packages/opencode/src/index.ts
            packages/opencode/src/cli/ui.ts
            packages/opencode/src/codius/bootstrap.ts
            packages/opencode/src/plugin/codius.ts
            packages/opencode/src/plugin/index.ts
            packages/opencode/src/acp/service.ts
            packages/opencode/test/codius/bootstrap.test.ts
          )
          existing=()
          for file in "${files[@]}"; do
            [[ -f "$file" ]] && existing+=("$file")
          done
          bunx prettier --write "${existing[@]}"

      - name: Persist formatting corrections
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "style: normalize Codius CLI productization [skip release-gate]"
          git push origin HEAD:feat/codius-productization

      - name: Run Codius provider bootstrap tests
        run: bun test packages/opencode/test/codius/bootstrap.test.ts

      - name: Type-check the coding agent
        run: bun run --cwd packages/opencode typecheck

      - name: Build the native Codius executable
        run: bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui

      - name: Smoke-test command and ACP surfaces
        shell: bash
        run: |
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --version
          "$binary" --help | grep -q 'codius'
          "$binary" acp --help | grep -qi 'acp\|agent client protocol'

      - name: Audit release contract
        shell: bash
        run: |
          grep -q 'https://devapi.codius.dev/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'https://api.codius.ai/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'CODIUS_API_KEY' packages/opencode/src/codius/bootstrap.ts
          grep -q 'scriptName("codius")' packages/opencode/src/index.ts
          grep -q 'name: "Codius"' packages/opencode/src/acp/service.ts
          grep -q 'command: "codius"' packages/opencode/src/acp/service.ts
          test -f packages/opencode/bin/codius
          test -f assets/codius-logo.svg

      - name: Remove temporary productization automation
        shell: bash
        run: |
          rm -f .github/workflows/codius-productization.yml
          rm -f .github/workflows/codius-release-gate.yml
          rm -f CODIUS_VALIDATION.md VALIDATION.md
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize Codius CLI release branch [skip release-gate]"
            git push origin HEAD:feat/codius-productization
          fi

      - name: Mark pull request ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-cli || true
          gh pr comment 1 --repo prismosoft/codius-cli --body "Codius CLI release gate passed: formatting, provider tests, typecheck, native build, command/ACP smoke tests, and release-contract audit are green. Temporary productization automation was removed."
