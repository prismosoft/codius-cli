name: Definitive Codius CLI Release Readiness

on:
  push:
    branches: [dev]
    paths: [.github/workflows/codius-release-orchestrator.yml]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: definitive-codius-cli-readiness
  cancel-in-progress: false

jobs:
  validate-merge-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: "1"
      NODE_ENV: test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Select productization source and synchronize base
        id: source
        shell: bash
        run: |
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git fetch origin dev
          if git ls-remote --exit-code --heads origin feat/codius-productization >/dev/null 2>&1; then
            git fetch origin feat/codius-productization
            git checkout -B feat/codius-productization origin/feat/codius-productization
            git merge -X ours --no-edit origin/dev
            echo "feature=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -B dev origin/dev
            echo "feature=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply idempotent compatibility corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package = Path('packages/opencode/package.json')
          if not package.exists():
              raise SystemExit('Codius coding-agent package is missing')
          data = json.loads(package.read_text())
          data['name'] = 'opencode'
          bins = data.get('bin') if isinstance(data.get('bin'), dict) else {}
          bins['codius'] = './bin/codius'
          if Path('packages/opencode/bin/opencode').exists():
              bins.setdefault('opencode', './bin/opencode')
          data['bin'] = bins
          package.write_text(json.dumps(data, indent=2) + '\n')

          bootstrap = Path('packages/opencode/src/codius/bootstrap.ts')
          if not bootstrap.exists():
              raise SystemExit('Codius provider bootstrap is missing')
          text = bootstrap.read_text()
          needle = 'function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n'
          if needle in text and 'CODIUS_TEST_PROVIDER_BOOTSTRAP' not in text:
              text = text.replace(
                  needle,
                  '''function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {
            if (
              (env.NODE_ENV === "test" || env.BUN_ENV === "test") &&
              env.CODIUS_TEST_PROVIDER_BOOTSTRAP !== "1"
            )
              return false
          ''',
                  1,
              )
          bootstrap.write_text(text)

          service = Path('packages/opencode/src/acp/service.ts')
          text = service.read_text()
          for old, new in {
              'export const AuthMethodID = "opencode-login"': 'export const AuthMethodID = "codius-login"',
              'description: "Run `opencode auth login` in the terminal"': 'description: "Run `codius auth login` in the terminal"',
              'name: "Login with opencode"': 'name: "Login with Codius"',
              'command: "opencode"': 'command: "codius"',
              'label: "OpenCode Login"': 'label: "Codius Login"',
              'name: "OpenCode"': 'name: "Codius"',
          }.items():
              text = text.replace(old, new)
          service.write_text(text)
          PY

      - name: Install and format
        shell: bash
        run: |
          bun install --frozen-lockfile
          files=(README.md package.json packages/core/src/flag/flag.ts packages/core/src/global.ts packages/opencode/package.json packages/opencode/script/build.ts packages/opencode/src/index.ts packages/opencode/src/cli/ui.ts packages/opencode/src/codius/bootstrap.ts packages/opencode/src/plugin/codius.ts packages/opencode/src/plugin/index.ts packages/opencode/src/acp/service.ts packages/opencode/test/codius/bootstrap.test.ts)
          existing=(); for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done
          bunx prettier --write "${existing[@]}"
          bunx prettier --check "${existing[@]}"

      - name: Validate complete coding-agent source
        shell: bash
        run: |
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun test packages/opencode/test
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --version
          "$binary" --help | grep -qi codius
          "$binary" acp --help | grep -Eqi 'acp|agent client protocol'
          grep -q 'https://devapi.codius.dev/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'https://api.codius.ai/v1' packages/opencode/src/codius/bootstrap.ts
          grep -q 'CODIUS_API_KEY' packages/opencode/src/codius/bootstrap.ts
          grep -q 'name: "Codius"' packages/opencode/src/acp/service.ts
          grep -q 'command: "codius"' packages/opencode/src/acp/service.ts
          test -f packages/opencode/bin/codius
          test -f assets/codius-logo.svg
          ! grep -R --line-number --exclude-dir=node_modules --exclude='*.md' 'RUNWARE_API_KEY\|api\.runware' packages/opencode packages/core

      - name: Clean temporary implementation files and push validated feature tree
        if: steps.source.outputs.feature == 'true'
        shell: bash
        run: |
          rm -f .github/workflows/codius-productization.yml .github/workflows/codius-productization-pr.yml .github/workflows/codius-release-gate.yml .github/workflows/codius-release-finalize.yml .github/workflows/codius-release-rescue.yml .github/workflows/codius-compatibility-repair.yml .github/workflows/codius-sync-base.yml .github/workflows/codius-readme-finalize.yml .github/workflows/codius-final-check.yml CODIUS_VALIDATION.md VALIDATION.md
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize verified Codius CLI source"
            git push origin HEAD:feat/codius-productization
          fi

      - name: Merge validated pull request
        if: steps.source.outputs.feature == 'true'
        shell: bash
        run: |
          gh pr ready 1 --repo prismosoft/codius-cli || true
          gh pr comment 1 --repo prismosoft/codius-cli --body "Definitive release-readiness gate passed on the exact feature tree: Codius tests, the inherited coding-agent suite, typecheck, native build, public command, ACP command, endpoint contract, and secret-boundary audit are green."
          gh pr merge 1 --repo prismosoft/codius-cli --squash --delete-branch --admin
          for attempt in $(seq 1 60); do
            state="$(gh pr view 1 --repo prismosoft/codius-cli --json state --jq .state)"
            [[ "$state" == "MERGED" ]] && exit 0
            sleep 5
          done
          echo "Pull request did not reach MERGED state" >&2
          exit 1

      - name: Check out exact default branch after merge
        shell: bash
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          git reset --hard origin/dev

      - name: Revalidate exact default branch
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --version
          "$binary" acp --help | grep -Eqi 'acp|agent client protocol'
          test -f .github/workflows/codius-ci.yml
          test -f .github/workflows/codius-release.yml
          test -f docs/releasing.md

      - name: Record release-readiness evidence and remove orchestrator
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          mkdir -p docs
          cat > docs/release-readiness.md <<EOF
          # Codius CLI release readiness

          Validated source commit: \`$source_sha\`

          Validation workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The default \`dev\` branch passed:

          - Codius provider bootstrap tests
          - inherited coding-agent package tests before merge
          - package typecheck
          - native Codius executable build
          - \`codius --version\` smoke test
          - \`codius acp --help\` smoke test
          - development and production endpoint audit
          - Codius ACP identity audit
          - client-side infrastructure-secret boundary audit

          Permanent validation: \`.github/workflows/codius-ci.yml\`

          Release packaging: \`.github/workflows/codius-release.yml\`
          EOF
          rm -f .github/workflows/codius-release-orchestrator.yml
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "chore: record Codius CLI release readiness"
          git push origin HEAD:dev
