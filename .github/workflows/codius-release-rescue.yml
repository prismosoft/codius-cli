name: Codius CLI Release Rescue

on:
  push:
    branches:
      - feat/codius-productization
    paths:
      - .github/workflows/codius-release-rescue.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      GH_TOKEN: ${{ github.token }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Normalize inherited internals and Codius public surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package = Path('packages/opencode/package.json')
          data = json.loads(package.read_text())
          data['name'] = 'opencode'
          bins = data.get('bin') if isinstance(data.get('bin'), dict) else {}
          bins['codius'] = './bin/codius'
          if Path('packages/opencode/bin/opencode').exists():
              bins.setdefault('opencode', './bin/opencode')
          data['bin'] = bins
          package.write_text(json.dumps(data, indent=2) + '\n')

          bootstrap = Path('packages/opencode/src/codius/bootstrap.ts')
          text = bootstrap.read_text()
          needle = 'function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {\n'
          guard = '''function shouldFetchProviderConfig(args: string[], env: NodeJS.ProcessEnv): boolean {
            if (
              (env.NODE_ENV === "test" || env.BUN_ENV === "test") &&
              env.CODIUS_TEST_PROVIDER_BOOTSTRAP !== "1"
            )
              return false
          '''
          if needle in text and 'CODIUS_TEST_PROVIDER_BOOTSTRAP' not in text:
              text = text.replace(needle, guard, 1)
          bootstrap.write_text(text)

          service = Path('packages/opencode/src/acp/service.ts')
          text = service.read_text()
          for old, new in {
              'export const AuthMethodID = "opencode-login"': 'export const AuthMethodID = "codius-login"',
              'description: "Run `opencode auth login` in the terminal"': 'description: "Run `codius auth login` in the terminal"',
              'name: "Login with opencode"': 'name: "Login with Codius"',
              'command: "opencode"': 'command: "codius"',
              'label: "OpenCode Login"': 'label: "Codius Login"',
              'name: "OpenCode"': 'name: "Codius"',
          }.items():
              text = text.replace(old, new)
          service.write_text(text)
          PY

      - name: Install and format
        run: |
          bun install --frozen-lockfile
          bunx prettier --write package.json packages/core/src/flag/flag.ts packages/core/src/global.ts packages/opencode/package.json packages/opencode/script/build.ts packages/opencode/src/index.ts packages/opencode/src/cli/ui.ts packages/opencode/src/codius/bootstrap.ts packages/opencode/src/plugin/codius.ts packages/opencode/src/plugin/index.ts packages/opencode/src/acp/service.ts packages/opencode/test/codius/bootstrap.test.ts

      - name: Run Codius tests and inherited package suite
        run: |
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode typecheck
          bun test packages/opencode/test
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui
          binary="$(find packages/opencode/dist -type f -path '*/bin/codius' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --version
          "$binary" --help | grep -qi codius

      - name: Commit verified rescue
        shell: bash
        run: |
          rm -f .github/workflows/codius-compatibility-repair.yml
          rm -f .github/workflows/codius-release-rescue.yml
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git add -A
          git commit -m "fix: validate Codius CLI against inherited agent suite"
          git push origin HEAD:feat/codius-productization
          gh pr comment 1 --repo prismosoft/codius-cli --body "Full Codius CLI rescue passed, including the inherited OpenCode package test suite, typecheck, native build, and command smoke test."
