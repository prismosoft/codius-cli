name: Release Codius CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, without the leading v
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: codius-cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      OPENCODE_CHANNEL: latest
      CODIUS_ENV: production
      GH_REPO: prismosoft/codius-cli
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OPENCODE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CODIUS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        run: |
          bun test packages/opencode/test/codius/bootstrap.test.ts
          bun run --cwd packages/opencode typecheck

      - name: Build native binaries
        run: bun run --cwd packages/opencode build --skip-embed-web-ui

      - name: Package Codius release archives
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          count=0
          for dir in packages/opencode/dist/opencode-*; do
            [[ -d "$dir/bin" && -f "$dir/bin/codius" ]] || continue
            target="${dir##*/opencode-}"
            if [[ "$target" == windows-* ]]; then
              (cd "$dir/bin" && zip -q -r "$GITHUB_WORKSPACE/release-assets/codius-${target}.zip" codius*)
            elif [[ "$target" == darwin-* ]]; then
              (cd "$dir/bin" && zip -q -r "$GITHUB_WORKSPACE/release-assets/codius-${target}.zip" codius*)
            else
              (cd "$dir/bin" && tar -czf "$GITHUB_WORKSPACE/release-assets/codius-${target}.tar.gz" codius*)
            fi
            count=$((count + 1))
          done
          test "$count" -gt 0
          ls -lh release-assets

      - name: Verify archives contain Codius
        shell: bash
        run: |
          for archive in release-assets/*; do
            case "$archive" in
              *.zip) unzip -l "$archive" | grep -qi codius ;;
              *.tar.gz) tar -tzf "$archive" | grep -qi codius ;;
            esac
          done

      - name: Create or update GitHub release
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          prerelease=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease="--prerelease"
          elif [[ "$tag" == *-* ]]; then
            prerelease="--prerelease"
          fi
          if ! gh release view "$tag" --repo prismosoft/codius-cli >/dev/null 2>&1; then
            gh release create "$tag" --repo prismosoft/codius-cli --title "Codius CLI $tag" --generate-notes $prerelease
          fi
          gh release upload "$tag" release-assets/* --repo prismosoft/codius-cli --clobber
