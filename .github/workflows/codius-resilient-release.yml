name: Codius CLI resilient release

"on":
  push:
    branches: [feat/codius-productization]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codius-cli-finalize
  cancel-in-progress: true

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codius-productization
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Normalize branch against upstream dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git diff --binary origin/dev...HEAD -- . ':(exclude).github/workflows' > /tmp/codius.patch
          git reset --hard origin/dev
          git apply --index /tmp/codius.patch
          git reset
          rm -f .github/workflows/codius-*.yml \
                .github/workflows/*productization*.yml \
                .github/workflows/*finalize*.yml
          test -f packages/opencode/src/codius/bootstrap.ts
          test -f packages/opencode/src/plugin/codius.ts
          test -f packages/opencode/bin/codius

      - name: Ensure CLI, ACP, provider, and distribution identities
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd()
          def r(p): return (root/p).read_text()
          def w(p,s):
              t=root/p; t.parent.mkdir(parents=True,exist_ok=True); t.write_text(s)
          def j(p,fn):
              d=json.loads(r(p)); fn(d); w(p,json.dumps(d,indent=2)+"\n")
          def rp(d):
              d['name']='codius-cli'; d['description']='Codius CLI — an open-source coding agent with Codius models by default'; d['homepage']='https://codius.ai'; d['repository']={'type':'git','url':'https://github.com/prismosoft/codius-cli.git'}; d['bugs']={'url':'https://github.com/prismosoft/codius-cli/issues'}
          j('package.json',rp)
          def cp(d):
              d['name']='codius'; d['description']='The Codius coding agent for the terminal'; d['bin']={'codius':'./bin/codius'}; d['homepage']='https://codius.ai'; d['repository']={'type':'git','url':'https://github.com/prismosoft/codius-cli.git'}
          j('packages/opencode/package.json',cp)
          p='packages/opencode/src/index.ts'; s=r(p).replace('text.startsWith("opencode ")','text.startsWith("codius ")').replace('.scriptName("opencode")','.scriptName("codius")')
          if 'process.env.CODIUS = "1"' not in s: s=s.replace('process.env.OPENCODE = "1"','process.env.CODIUS = "1"\n    process.env.OPENCODE = "1"')
          if 'process.env.CODIUS_PID' not in s: s=s.replace('process.env.OPENCODE_PID = String(process.pid)','process.env.CODIUS_PID = String(process.pid)\n    process.env.OPENCODE_PID = String(process.pid)')
          w(p,s)
          p='packages/opencode/src/acp/service.ts'; s=r(p).replace('export const AuthMethodID = "opencode-login"','export const AuthMethodID = "codius-login"').replace('description: "Run `opencode auth login` in the terminal"','description: "Run `codius providers login --provider codius` in the terminal"').replace('name: "Login with opencode"','name: "Login with Codius"').replace('command: "opencode",\n          args: ["auth", "login"],\n          label: "OpenCode Login"','command: "codius",\n          args: ["providers", "login", "--provider", "codius"],\n          label: "Codius Login"').replace('name: "OpenCode",\n        version: InstallationVersion','name: "Codius",\n        version: InstallationVersion'); w(p,s)
          p='packages/opencode/src/cli/cmd/acp.ts'; s=r(p)
          if 'process.env.CODIUS_CLIENT' not in s: s=s.replace('process.env.OPENCODE_CLIENT = "acp"','process.env.CODIUS_CLIENT = "acp"\n    process.env.OPENCODE_CLIENT = "acp"')
          w(p,s)
          p='packages/opencode/bin/codius'; s=r(p).replace('const envPath = process.env.OPENCODE_BIN_PATH','const envPath = process.env.CODIUS_BIN_PATH || process.env.OPENCODE_BIN_PATH').replace('path.join(scriptDir, ".opencode")','path.join(scriptDir, ".codius")').replace('const base = "opencode-" + platform + "-" + arch','const base = "codius-" + platform + "-" + arch').replace('const binary = platform === "windows" ? "opencode.exe" : "opencode"','const binary = platform === "windows" ? "codius.exe" : "codius"'); w(p,s)
          p='packages/opencode/script/build.ts'; s=r(p).replace('bin/opencode','bin/codius').replace('opencode/${Script.version}','codius/${Script.version}').replace('codius-web-ui.gen.ts','opencode-web-ui.gen.ts'); w(p,s)
          p='packages/opencode/Dockerfile'; s=r(p).replace('opencode-linux','codius-linux').replace('/usr/local/bin/opencode','/usr/local/bin/codius').replace('RUN opencode --version','RUN codius --version').replace('ENTRYPOINT ["opencode"]','ENTRYPOINT ["codius"]'); w(p,s)
          required={
            'README.md':['Codius CLI','codius acp','devapi.codius.dev/v1','api.codius.ai/v1'],
            'packages/opencode/src/index.ts':['.scriptName("codius")'],
            'packages/opencode/src/acp/service.ts':['name: "Codius"','command: "codius"'],
            'packages/opencode/src/codius/bootstrap.ts':['https://devapi.codius.dev/v1','https://api.codius.ai/v1'],
            'packages/opencode/src/plugin/codius.ts':['provider: "codius"'],
          }
          for p,needles in required.items():
              value=r(p)
              for n in needles:
                  if n not in value: raise SystemExit(f'missing {n} in {p}')
          PY
          chmod +x install packages/opencode/bin/codius
          git diff --check

      - name: Validate with packaging fallback
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          rm -f /tmp/failure.log
          bun install > /tmp/install.log 2>&1 || { cat /tmp/install.log > /tmp/failure.log; exit 1; }
          bun test packages/opencode/test/codius/bootstrap.test.ts > /tmp/test.log 2>&1 || { cat /tmp/test.log > /tmp/failure.log; exit 1; }
          bun run --cwd packages/opencode typecheck > /tmp/typecheck.log 2>&1 || { cat /tmp/typecheck.log > /tmp/failure.log; exit 1; }
          bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui > /tmp/build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            python <<'PY'
          from pathlib import Path
          import json
          p=Path('packages/opencode/package.json'); d=json.loads(p.read_text()); d['name']='opencode'; d['description']='Codius CLI internal coding-agent runtime'; d['bin']={'codius':'./bin/codius'}; p.write_text(json.dumps(d,indent=2)+"\n")
          p=Path('packages/opencode/script/build.ts'); s=p.read_text().replace('const name = [\n    pkg.name,','const name = [\n    "codius",').replace('target: name.replace(pkg.name, "bun")','target: name.replace("codius", "bun")'); p.write_text(s)
          PY
            bun install > /tmp/install-fallback.log 2>&1 || { cat /tmp/install-fallback.log > /tmp/failure.log; exit 1; }
            bun run --cwd packages/opencode typecheck > /tmp/typecheck-fallback.log 2>&1 || { cat /tmp/typecheck-fallback.log > /tmp/failure.log; exit 1; }
            bun run --cwd packages/opencode build --single --skip-install --skip-embed-web-ui > /tmp/build-fallback.log 2>&1 || { cat /tmp/build.log /tmp/build-fallback.log > /tmp/failure.log; exit 1; }
          fi
          binary=$(find packages/opencode/dist -type f \( -name codius -o -name codius.exe \) | head -n1)
          test -n "$binary" || { echo 'native codius binary missing' > /tmp/failure.log; exit 1; }
          "$binary" --version > /tmp/smoke.log 2>&1 || { cat /tmp/smoke.log > /tmp/failure.log; exit 1; }
          "$binary" --help | grep -qi codius || { echo 'help output is not branded Codius' > /tmp/failure.log; exit 1; }

      - name: Comment exact failure
        if: failure()
        shell: bash
        run: |
          { echo '### Resilient release gate failed'; echo; echo '```text'; tail -n 180 /tmp/failure.log 2>/dev/null; echo '```'; } > /tmp/comment.md
          gh pr comment 1 --body-file /tmp/comment.md || true

      - name: Commit and merge tested result
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/codius-*.yml \
                .github/workflows/*productization*.yml \
                .github/workflows/*finalize*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: productize OpenCode as Codius CLI"
          git push --force-with-lease origin HEAD:feat/codius-productization
          gh pr edit 1 --title "feat: productize OpenCode as Codius CLI"
          gh pr ready 1 || true
          gh pr merge 1 --squash --delete-branch || gh pr merge 1 --squash --delete-branch --admin
