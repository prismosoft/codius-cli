name: Synchronize Codius CLI Productization

on:
  push:
    branches: [feat/codius-productization]
    paths: [.github/workflows/codius-sync-base.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/codius-productization, fetch-depth: 0 }
      - name: Merge dev and resolve release infrastructure
        shell: bash
        run: |
          git config user.name "Codius CI"
          git config user.email "actions@codius.ai"
          git fetch origin dev
          set +e
          git merge --no-commit --no-ff origin/dev
          merge_rc=$?
          set -e
          for path in .github/workflows/codius-ci.yml .github/workflows/codius-release.yml docs/releasing.md; do
            if git ls-files -u -- "$path" | grep -q .; then
              git checkout --theirs -- "$path"
              git add "$path"
            fi
          done
          if git ls-files -u | grep -q .; then
            echo "Unresolved conflicts remain:" >&2
            git status --short >&2
            exit 1
          fi
          rm -f .github/workflows/codius-sync-base.yml
          git add -A
          git commit -m "chore: synchronize productization branch with dev"
          git push origin HEAD:feat/codius-productization
